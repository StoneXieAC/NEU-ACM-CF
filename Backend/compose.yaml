services:
  api:
    container_name: neu-acm-cf-api
    build:
      context: ..
      dockerfile: Backend/Dockerfile
      network: host
    environment:
      PORT: "3000"
      DATABASE_PATH: /app/data/cache.db
      MEMBER_CSV_PATH: /app/Backend/config/handle.csv
      SYNC_CRON: "*/20 * * * *"
      TZ: Asia/Shanghai
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  backend-data:
