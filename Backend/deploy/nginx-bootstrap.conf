server {
    listen 80;
    listen [::]:80;
    server_name 124.223.4.216;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 200 "NEU ACM CF API certificate bootstrap\n";
        add_header Content-Type text/plain;
    }
}
